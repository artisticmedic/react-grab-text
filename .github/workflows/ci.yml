name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        react-grab-build: [stock, fork]
    name: test (${{ matrix.react-grab-build }} react-grab)
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run build
      - run: npx playwright install chromium --with-deps
      - run: npx playwright test
        env:
          PLAYWRIGHT_CHROMIUM_CHANNEL: chromium
          REACT_GRAB_BUILD: ${{ matrix.react-grab-build }}
